##############################################################################
# Grid Intelligence + AESO — single nginx vhost on port 80
#
# Replaces the 8081 approach. Port 8081 needs an Azure NSG inbound rule, which
# repeatedly failed to take effect; port 80 is already open and proven. Serving
# both apps here removes the cloud-config dependency entirely.
#
# /api/*   → Node API server (localhost:8080), shared by both apps
# /pypsa/* → Node proxies on to FastAPI (localhost:8083)
# /aeso/*  → AESO Alberta platform   (/var/www/aeso-platform)
# /*       → Grid Origination platform (/var/www/grid-platform)
#
# IMPORTANT: the AESO frontend must be built with BASE_PATH=/aeso/ — vite bakes
# asset URLs in at build time, so a BASE_PATH=/ bundle served here would request
# /assets/... and 404. App.tsx already feeds import.meta.env.BASE_URL into the
# wouter router, so client-side routing follows automatically.
#
# Install:
#   sudo cp infra/nginx-grid.conf /etc/nginx/sites-available/grid-intelligence
#   sudo nginx -t && sudo systemctl reload nginx
##############################################################################
server {
    listen 80;
    server_name _;

    root /var/www/grid-platform;
    index index.html;

    # ── AESO platform under /aeso/ ───────────────────────────────────────────
    # alias (not root) so /aeso/assets/x.js maps to /var/www/aeso-platform/assets/x.js
    # rather than /var/www/aeso-platform/aeso/assets/x.js.
    location /aeso/ {
        alias /var/www/aeso-platform/;
        try_files $uri $uri/ /aeso/index.html;
    }

    # Bare /aeso with no trailing slash would miss the location above.
    location = /aeso {
        return 301 /aeso/;
    }

    # ── Grid platform (default) ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy (shared) ───────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Raised from 60s: the AESO rankings query aggregates ~15M metered rows
        # and returned an empty body at the default timeout on a cold cache.
        proxy_read_timeout    180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
    }

    # ── PyPSA proxy (via Node so auth/session middleware runs first) ─────────
    location /pypsa/ {
        proxy_pass         http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    180s;   # OPF solve can take 30-90s
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
    }

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied    any;
}

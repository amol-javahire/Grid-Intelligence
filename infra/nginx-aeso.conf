##############################################################################
# AESO Alberta Platform — nginx vhost
#
# Served on port 8081 rather than a /aeso/ subpath on port 80. Reason: vite
# bakes asset paths in at build time, so a subpath deployment needs the whole
# frontend rebuilt with BASE_PATH=/aeso/. A separate port keeps the app at a
# root and lets the same BASE_PATH=/ bundle serve both here and later at a
# subdomain, without a rebuild in between.
#
# /api/*   → Node API server (localhost:8080) — SHARED with the grid platform.
#            Both apps hit the same api-server; AESO routes live under
#            /api/aeso/*, so there is no collision.
# /*       → /var/www/aeso-platform  (vite build, BASE_PATH=/)
#
# NOTE: port 8081 must be open in the Azure Network Security Group for the VM,
# otherwise this listens fine but nothing reaches it from outside.
#
# Install:
#   sudo cp infra/nginx-aeso.conf /etc/nginx/sites-available/aeso-platform
#   sudo ln -sf /etc/nginx/sites-available/aeso-platform /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
##############################################################################
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /var/www/aeso-platform;
    index index.html;

    # SPA fallback — wouter handles client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy (same Node server as the grid platform) ────────────────────
    location /api/ {
        proxy_pass         http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The rankings query aggregates ~15M metered rows and is slow on a cold
        # cache — it returned an empty body at the default 60s. Raised until
        # that route is repointed at the precomputed aeso_asset_ttm view.
        proxy_read_timeout    180s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
    }

    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    add_header X-Frame-Options        "SAMEORIGIN"    always;
    add_header X-Content-Type-Options "nosniff"       always;
    add_header Referrer-Policy        "strict-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied    any;
}
